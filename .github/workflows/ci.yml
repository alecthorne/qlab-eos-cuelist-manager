name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and test the Xcode project
        run: >
          xcodebuild -project QLabEosCuelistManager.xcodeproj
          -scheme QLabEosCuelistManager
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build test
